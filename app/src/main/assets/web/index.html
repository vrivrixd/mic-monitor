<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mic Monitor</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="unsupported" class="notice" hidden>
  <h1>Mic Monitor</h1>
  <p data-i18n="mobile1"></p>
  <p data-i18n="mobile2"></p>
</div>

<main id="main" hidden>
  <h1>Mic Monitor</h1>
  <p class="lead" data-i18n="lead"></p>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <button type="button" id="enableAudio" class="enable" data-i18n="start" hidden></button>

  <div id="controls" hidden>
    <h2 data-i18n="settings"></h2>

    <form id="settings">

      <div class="field" id="outputField" hidden>
        <label for="output" data-i18n="output"></label>
        <select id="output"></select>
      </div>

      <div class="field">
        <label for="gain" data-i18n="gain"></label>
        <input type="range" id="gain" min="0" max="100" step="1" value="50">
      </div>

      <div class="field checkbox">
        <input type="checkbox" id="mute">
        <label for="mute" data-i18n="mute"></label>
      </div>

      <div class="field">
        <label for="mic" data-i18n="mic"></label>
        <select id="mic">
          <option value="default" data-i18n="micDefault"></option>
          <option value="front" data-i18n="micFront"></option>
          <option value="camera" data-i18n="micRear"></option>
        </select>
      </div>

      <div class="field checkbox">
        <input type="checkbox" id="stereo">
        <label for="stereo" data-i18n="stereo"></label>
      </div>

      <div class="field">
        <label for="buffer" data-i18n="buffer"></label>
        <select id="buffer">
          <option value="60" data-i18n="buffer60"></option>
          <option value="100" data-i18n="buffer100"></option>
          <option value="150" data-i18n="buffer150"></option>
          <option value="250" data-i18n="buffer250"></option>
          <option value="400" data-i18n="buffer400"></option>
        </select>
      </div>

      <p class="hint" id="stereoHint" hidden></p>

    </form>

    <button type="button" id="disconnect" class="disconnect" data-i18n="disconnect"></button>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
