name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o SDK do Android
        uses: android-actions/setup-android@v3

      - name: Instalar as ferramentas da plataforma
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/micmonitor.p12

      - name: Compilar a versao assinada
        env:
          MIC_MONITOR_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MIC_MONITOR_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MIC_MONITOR_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Descartar a chave
        if: always()
        run: rm -f app/micmonitor.p12

      - name: Publicar os APKs
        uses: actions/upload-artifact@v4
        with:
          name: mic-monitor-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
